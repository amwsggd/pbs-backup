# pbs-cold-manager.conf — pbs-cold-manager.sh 的多源×多目标配置文件(bash 语法,被 source)
#
# 模型:多个 zfs 源 × 多个 S3 目标。快照命名与旧版一致(<源>@pbs-<ts>):
# 同一轮里同源各目标复用同一份快照(manager 注入统一 BACKUP_TS,已存在则复用,
# 不重复创建);全量/增量与增量基由脚本按各目标自己的 S3 链推导(链目录名/inc-<ts>
# 即快照 ts),基快照被清理则自动回退全量;新加的目标链为空,首次自动全量。
# 上传失败时脚本删除本次创建的快照和本次上传的 S3 内容(旧数据不动),日志会记录。
#
# 变量三层结构:
#   1. 共享层:所有目标继承的通用配置;
#   2. 默认脚本:目标未单独指定脚本时使用的备份/恢复脚本;
#   3. 目标级:<目标>_<变量> 覆盖共享层;
#      源×目标级:<目标>_<源slug>_<变量> 再覆盖目标级(目前支持 KEY/DEST_ZVOL)。
#
# 可覆盖变量(两套脚本配置项的并集):
#   ZVOL S3_BUCKET S3_PREFIX S3_ENDPOINT PASSPHRASE_FILE WEAK_PASS
#   VOL_SIZE_MB CLIPS_PER_VOL CLIP_MIN_MB CLIP_MAX_MB ENTRY_DIR VOL_BASE
#   TMP_DIR RESTORE_TMP DEST_ZVOL DEST_SIZE PART_SIZE PART_FORMAT SNAP_TAG
#   SEVENZ HEADER_SEED PAD_SLACK KEEP_SNAPSHOTS FULL_EVERY KEEP_CHAINS
#   RETRY_ATTEMPTS RETRY_DELAY

# ===== 源(zfs zvol)与目标(S3) =====
SOURCES=(tank/pbs-datastore)
TARGETS=(baidu)

# 按源收窄目标(可选;不配则该源备份到全部 TARGETS)。
# 变量名 = 源路径的 slug(/ 和 - 都换成 _):
# tank_pbs_datastore_TARGETS=(baidu ali)

# ===== 密钥注册表:密钥 id → 密钥文件路径 =====
# 每个 (源,目标) 关系引用密钥 id,三级查找:
#   <目标>_<源slug>_KEY → <目标>_KEY → 共享 KEY(默认 default)
# 未定义本表时回退到 PASSPHRASE_FILE 直配(旧式)。
declare -A KEYS=(
    [default]="/etc/pbs-cold-backup/passphrase"
    # [baidu]="/etc/pbs-cold-backup/pass-baidu"
    # [ali]="/etc/pbs-cold-backup/pass-ali"
)
KEY=default          # 共享层默认密钥 id

# ===== 共享层 =====
TMP_DIR="/tank/pbs-cold-backup-tmp"
RESTORE_TMP="/tank/pbs-cold-backup-tmp"
VOL_SIZE_MB=1024
DEST_ZVOL="tank/pbs-restore"                        # 恢复落点(共享默认)

# ===== 默认脚本(相对路径相对 pbs-cold-manager.sh 所在目录) =====
DEFAULT_BACKUP_SCRIPT="pbs-cold-backup-7z.sh"
DEFAULT_RESTORE_SCRIPT="pbs-cold-restore-7z.sh"

# ===== baidu:默认 7z 分卷 =====
baidu_S3_BUCKET="baidu-pbs"
baidu_S3_PREFIX="pbs-cold-backup-7z"
baidu_S3_ENDPOINT="https://s3.openlist.example.com"
# baidu_KEY=baidu                            # 该目标用 baidu 密钥(覆盖共享 KEY)
# baidu_DEST_ZVOL="tank/pbs-restore"         # 恢复该目标的落点(目标级)
# baidu_tank_pbs_datastore_DEST_ZVOL="tank/pbs-restore-baidu"
                                             # 恢复该目标×该源的落点(最优先)
# baidu_tank_pbs_datastore_KEY=ali           # 该目标×该源用 ali 密钥(最优先)

# ===== 示例:第二个目标,用旧的非 7z 脚本 =====
# TARGETS=(baidu ali)
# ali_BACKUP_SCRIPT="pbs-cold-backup.sh"
# ali_RESTORE_SCRIPT="pbs-cold-restore.sh"
# ali_S3_BUCKET="ali-pbs"
# ali_S3_PREFIX="pbs-cold-backup"
# ali_S3_ENDPOINT="https://s3.example.com"
# ali_KEY=ali                                # 用 ali 密钥
# ali_VOL_SIZE_MB=2048                       # 目标级覆盖共享层(对该脚本无效的变量会被忽略)

# ===== 示例:第二个源 =====
# SOURCES=(tank/pbs-datastore tank/vm-100)
# tank_vm_100_TARGETS=(ali)                  # 该源只备份到 ali
# 恢复时若目标有多个源,必须显式指定: pbs-cold-manager.sh restore <目标> <源>
