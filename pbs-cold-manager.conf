# pbs-cold-manager.conf — pbs-cold-manager.sh 的多目标配置文件(bash 语法,被 source)
#
# 三层结构:
#   1. 共享层:所有目标继承的通用配置;
#   2. 默认脚本:目标未单独指定脚本时使用的备份/恢复脚本(避免逐目标重复配置);
#   3. 目标级:<目标名>_<变量名> 覆盖共享层(脚本同理:<目标名>_BACKUP_SCRIPT)。
#
# 可覆盖变量(两套脚本配置项的并集):
#   ZVOL S3_BUCKET S3_PREFIX S3_ENDPOINT PASSPHRASE_FILE WEAK_PASS
#   VOL_SIZE_MB CLIPS_PER_VOL CLIP_MIN_MB CLIP_MAX_MB ENTRY_DIR VOL_BASE
#   TMP_DIR RESTORE_TMP DEST_ZVOL DEST_SIZE PART_SIZE PART_FORMAT SNAP_TAG
#   SEVENZ HEADER_SEED PAD_SLACK KEEP_SNAPSHOTS FULL_EVERY KEEP_CHAINS
#   RETRY_ATTEMPTS RETRY_DELAY

# ===== 共享层 =====
ZVOL="tank/pbs-datastore"
PASSPHRASE_FILE="/etc/pbs-cold-backup/passphrase"
TMP_DIR="/tank/pbs-cold-backup-tmp"
RESTORE_TMP="/tank/pbs-cold-backup-tmp"
VOL_SIZE_MB=1024

# ===== 默认脚本(相对路径相对 pbs-cold-manager.sh 所在目录) =====
DEFAULT_BACKUP_SCRIPT="pbs-cold-backup-7z.sh"
DEFAULT_RESTORE_SCRIPT="pbs-cold-restore-7z.sh"

# ===== 目标列表(备份按此顺序逐个执行) =====
TARGETS=(baidu)

# ===== baidu:默认 7z 分卷 =====
baidu_S3_BUCKET="baidu-pbs"
baidu_S3_PREFIX="pbs-cold-backup-7z"
baidu_S3_ENDPOINT="https://s3.openlist.example.com"
# baidu_DEST_ZVOL="tank/pbs-restore"        # 恢复该目标时的落点(可选覆盖)
# baidu_SNAP_TAG="pbs-baidu"                # 同一 ZVOL 多目标时必须错开快照标签
                                            # (默认 pbs;各目标独立计数全量/增量节奏)

# ===== 示例:第二个目标,用旧的非 7z 脚本 =====
# TARGETS=(baidu ali)
# ali_BACKUP_SCRIPT="pbs-cold-backup.sh"
# ali_RESTORE_SCRIPT="pbs-cold-restore.sh"
# ali_S3_BUCKET="ali-pbs"
# ali_S3_PREFIX="pbs-cold-backup"
# ali_S3_ENDPOINT="https://s3.example.com"
# ali_VOL_SIZE_MB=2048                       # 目标级覆盖共享层(对该脚本无效的变量会被忽略)
